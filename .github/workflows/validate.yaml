name: validate

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:

      - name: git > checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: terraform > setup
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.8

      - name: terraform > fmt
        run: terraform fmt -check -recursive

      - name: terraform > init
        run: terraform init -backend=false -input=false

      - name: terraform > validate
        run: terraform validate

      - name: terraform > test
        run: terraform test -no-color

      - name: terraform > checkov
        uses: bridgecrewio/checkov-action@a050c269d5ff0d9dc04f4826f3d268ace7b05592
        with:
          framework: terraform,github_actions
          directory: .
          quiet: "true"
          compact: "true"

      - name: terraform > verify README
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: "true"
          args: --hide providers
