name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (semver). minor for new optional inputs, major for breaking changes.
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

concurrency:
  group: hoop-module-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    steps:

      - name: git > checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: terraform > setup
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.8

      - name: terraform > fmt
        run: terraform fmt -check -recursive

      - name: terraform > init
        run: terraform init -backend=false -input=false

      - name: terraform > validate
        run: terraform validate

      - name: terraform > test
        run: terraform test -no-color

      - name: release > create
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: rymndhng/release-on-push-action@aebba2bbce07a9474bf95e8710e5ee8a9e922fe2
        with:
          bump_version_scheme: ${{ inputs.bump }}
          tag_prefix: v
          use_github_release_notes: "true"
