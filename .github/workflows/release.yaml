name: release

# Manual on purpose: every tag is a version consumers can pin, so a release is a
# decision, not a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (semver). minor for new optional inputs, major for breaking changes."
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hoop-module-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - run: terraform fmt -check -recursive

      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test -no-color

      - name: Create release
        uses: rymndhng/release-on-push-action@v0.28.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          bump_version_scheme: ${{ inputs.bump }}
          tag_prefix: v
          use_github_release_notes: true
